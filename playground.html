<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — Complete Intro to Vue 3</title>
  </head>
  <body>
    <h1>Hello Frontend Masters!</h1>
    <div id="app">
      <div id="grid">
        <div>
          <ul v-for="item in listOfNumbers">
            <li>
              {{ item.id }}
              <ul>
                <button @click="addFav(item.id)">Add to fav</button>
                <li v-for="number in item.list">
                  {{ number }}
                </li>
              </ul>
            </li>
          </ul>
          <h2>Add new item</h2>
          <label for="newItem">Name for new item:</label>
          <input @keyup.enter="addNewItem" />
        </div>
        <div>
          <ul v-for="id in userFavouriteList">
            <li>
              {{ id }}
              {{ getListFor(id) }}
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue

      const app = createApp({
        data() {
          return {
            message: 'Hello it works',
            userFavouriteList: [],
            newItem: {
              name: '',
              id: '',
              list: [1, 2, 3]
            },
            listOfNumbers: [
              {
                name: 'ben',
                id: '6a887cd2-f0bf-4321-b192-92016f82a883',
                list: [1, 2, 3]
              },
              {
                name: 'anna',
                id: '8d14d90b-2d47-473e-8293-d5c324111d0d',
                list: [1, 2, 3]
              },
              {
                name: 'nina',
                id: 'cd806d65-2309-4625-9104-dcd636cd79b5',
                list: [1, 2, 3]
              },
              {
                name: 'elo',
                id: '00c939cd-fbf4-46d0-8e61-0bc2ce8a5332',
                list: [1, 2, 3]
              },
              {
                name: 5,
                id: '295a8170-59c1-4462-9de1-3c9cd41cedab',
                list: [1, 2, 3]
              }
            ]
          }
        },
        methods: {
          addFav(id) {
            console.log(id)
            this.userFavouriteList.push(id);
          },
          addNewItem() {
            this.newItem.id = `295a8170-59c1-4462-9de1-3c9cd41cedab-${this.listOfNumbers.length}`;
            this.listOfNumbers.push(this.newItem);
            this.newItem = {
              name: '',
              id: '',
              list: [1, 2, 3]
            };
          },
          getListFor(id) {
            const index = this.listOfNumbers.indexOf(id);
            return this.listOfNumbers.at(index).list;
          }
        }
      })

      app.mount('#app')
    </script>
    <style>
      h1 { color: blue; }
      #grid {
        display: flex;
        width: 100%;
        justify-content: space-around;
      }
    </style>
  </body>
</html>
